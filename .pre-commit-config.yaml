# Mechanical enforcement of the rules that used to be prose-only.
# Install once per clone:  pre-commit install
# (start_project.sh does this automatically when pre-commit is available.)
repos:
  - repo: local
    hooks:
      - id: ai-context-state-size
        name: "S7: .ai_context/state.md <= 5 KB"
        entry: scripts/check-state-size.sh
        language: system
        files: ^\.ai_context/state\.md$
        pass_filenames: false

      - id: gitleaks-secret-scan
        name: "H1: no secrets (gitleaks)"
        entry: scripts/precommit-gitleaks.sh
        language: system
        pass_filenames: false

      - id: ai-context-append-only
        name: "append-only: decisions/journal/scoreboard/friction/defects/donelog/trust"
        entry: scripts/check-append-only.sh
        language: system
        files: ^(\.ai_context/(decisions\.md|scoreboard(-v4)?\.csv|friction\.csv|defects\.csv|journal/.+\.md|tasks/.+/(donelog|gatelog|spawnlog))|\.claude/done-lanes\.trust)$
        # pre-commit never lists a deleted file: without always_run a commit
        # that only deletes or renames one of these never reaches the check
        # (the script reads the staged diff itself).
        always_run: true
        pass_filenames: false

      - id: ai-context-bulk
        name: "S2: no bulk dumps in .ai_context (<= 100 KB per file)"
        entry: scripts/check-context-bulk.sh
        language: system
        files: ^\.ai_context/
        pass_filenames: false
